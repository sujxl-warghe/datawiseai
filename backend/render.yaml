services:
  - type: web
    name: datawiseai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URL
        sync: false
      - key: DB_NAME
        value: datawise
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MODELS_DIR
        value: ./models
      - key: REPORTS_DIR
        value: ./reports
